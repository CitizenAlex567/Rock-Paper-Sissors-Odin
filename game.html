<body>
    
    <script>
        function getComputerChoice(max){
        const randomNumber = Math.floor(Math.random() * max)
        if (randomNumber === 0) {
            return "rock"
        } else if (randomNumber === 1) {
            return "paper"
        } else {
            return "scissors"
        }

        }
        console.log(getComputerChoice(3))
        
    </script>

</body>
